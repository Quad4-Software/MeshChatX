# SPDX-License-Identifier: 0BSD
# Local hooks: task hooks:install (installs envs, enables .githooks/)
default_install_hook_types: [pre-commit, commit-msg]

exclude: |
    (?x)^(
      vendor/|
      meshchatx/public/|
      meshchatx/src/frontend/public/|
      android/app/src/main/python/meshchatx/|
      \.pnpm-store/|
      node_modules/|
      build/|
      dist/|
      \.venv/
    )

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
            exclude: ^(uv\.lock|pnpm-lock\.yaml)$
          - id: check-yaml
            args: [--unsafe]
          - id: check-added-large-files
            args: [--maxkb=1024]
          - id: check-merge-conflict
          - id: check-json

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.14.2
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v4.0.0-alpha.8
      hooks:
          - id: prettier
            types_or: [javascript, jsx, ts, tsx, svelte, css, scss, json, yaml, markdown]
            exclude: ^(pnpm-lock\.yaml|uv\.lock|\.pre-commit-config\.yaml)$

    - repo: local
      hooks:
          - id: oxlint
            name: oxlint (staged js/ts)
            entry: scripts/ci/pre-commit-oxlint.sh
            language: script
            files: \.(js|mjs|cjs|ts)$
          - id: eslint
            name: eslint (staged)
            entry: scripts/ci/pre-commit-eslint.sh
            language: script
            files: \.(js|mjs|cjs|ts|svelte)$
          - id: meshchatx-rsm
            name: resign meshchatx.rsm
            entry: scripts/ci/pre-commit-tree-rsm.sh
            language: script
            pass_filenames: false
            always_run: true
          - id: commitlint
            name: commitlint
            entry: scripts/ci/pre-commit-commitlint.sh
            language: script
            stages: [commit-msg]

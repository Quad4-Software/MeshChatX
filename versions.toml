# SPDX-License-Identifier: 0BSD
#
# Single source for dependency versions that are pinned in more than one
# build file. Edit a value here (or pass name=version to the sync script)
# and run:
#
#   pnpm run deps:sync        # or: task deps:sync
#
# The sync rewrites matching specifiers in pyproject.toml
# [project].dependencies and in the Chaquopy pip block of
# android/app/build.gradle, patches patched-wheel filenames, then runs
# uv lock and uv export --no-dev -o requirements.txt. Operators and extra
# constraints (,<x, [extras], ; markers) are preserved.
#
# Bump one dep without editing this file:
#   pnpm run deps:sync -- lxmf=1.2.0
#   pnpm run deps:sync -- android.pip.bcrypt=3.1.8   # one section only
#
# Follow-ups the sync prints but does not run: licenses:refresh and
# build-repository-wheels (both need the synced environment).

# Versions that match on every surface where the name appears.
[shared]
lxmf = "1.2.0"
rns = "1.5.5"
aiohttp = "3.14.3"
aiohttp-session = "2.12.1"
aioquic = "1.3.0"
cborx = "0.2.5"
httpx = "0.28.1"
miniaudio = "1.70"
psutil = "7.2.2"
pycparser = "3.0"
pyserial = "3.5"

# Desktop-only floors in pyproject.toml [project].dependencies.
[pyproject]
lxst = "0.5.3"
bcrypt = "5.0.0"
websockets = "17.1"
cryptography = "50.0.1"
bleak = "3.0.2"
wasmtime = "48.0.0"
landlockpy = "0.2.0"
seccompy = "0.2.0"
audioop-lts = "0.2.2"

# Chaquopy pip installs in android/app/build.gradle. These can diverge
# from the desktop floors (different wheels, older builds on purpose).
[android.pip]
packaging = "23"
numpy = "1.26.2"
chaquopy-libcodec2 = "1.2.0"
pycodec2 = "4.1.1"
lxst-filterlib-android = "0.5.1"
bcrypt = "3.1.7"
websockets = "16.0"
cryptography = "50.0.0"
usbserial4a = "0.4.0"
ply = "3.11"
pylsqpack = "0.3.24"
pyopenssl = "26.4.0"
service-identity = "26.1.0"
attrs = "26.1.0"

# Patched wheels in android/vendor/<name>-<version>-py3-none-any.whl.
# Versions track the vendored builds, which may lag the PyPI floors.
[android.wheels]
rns = "1.5.5"
lxst = "0.5.1"
bleak = "3.0.2"

[project]
name = "reticulum-meshchatx"
version = "4.8.6"
description = "A simple mesh network communications app powered by the Reticulum Network Stack"
authors = [
  {name = "Quad4"}
]
license = "0BSD AND MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["reticulum", "meshchat", "meshchatx", "lxmf", "rns"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Other Audience",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "aiohttp>=3.14.3",
  "lxmf>=1.1.1",
  "psutil>=7.2.2",
  "pyserial>=3.5",
  "rns>=1.5.2",
  "websockets>=17.1",
  "bcrypt>=5.0.0,<6.0.0",
  "aiohttp-session>=2.12.1,<3.0.0",
  "cryptography>=50.0.1,<51.0.0",
  "pycparser>=3.0",
  "audioop-lts>=0.2.2; python_version >= '3.13'",
  "ply>=3.11,<4.0",
  "lxst>=0.5.2",
  "miniaudio (>=1.70,<2.0)",
  "cbor2>=6.1.4",
  "wasmtime>=48.0.0",
  "bleak>=3.0.2,<4.0",
  "httpx[http2]>=0.28.1,<1.0",
  "altcha>=2.1.0",
]

[project.scripts]
meshchatx = "meshchatx.meshchat:main"
meshchat = "meshchatx.meshchat:main"
meshchatx-repository-http = "meshchatx.repository_http_standalone:main"
lxmfy = "lxmfy.cli:main"
rns-filesync = "rns_filesync.cli:main"

[project.urls]
Homepage = "https://github.com/Quad4-Software/MeshChatX"

[tool.uv]
constraint-dependencies = [
  "h2>=4.4.1",
  "numpy>=2.4.6,<2.5",
]
override-dependencies = [
  "setuptools>=83.0.0",
]

[tool.setuptools.packages.find]
where = [".", "vendor/lxmfy", "vendor/rns_filesync"]
include = ["meshchatx*", "lxmfy*", "rns_filesync*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
meshchatx = ["public/**/*", "public/*", "src/backend/data/community_interfaces.json", "src/backend/data/licenses_frontend.json", "src/backend/data/licenses_backend.json", "src/backend/data/THIRD_PARTY_NOTICES.txt", "src/backend/data/plugins/**/*", "src/backend/data/interfaces/**/*", "src/backend/data/map/**/*", "src/frontend/public/repository-server-index.html"]

[tool.setuptools.exclude-package-data]
meshchatx = ["public/repository-server-bundled/**"]

[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "cx-freeze>=7.0.0,<8.7.0",
    "hypothesis>=6.167.0",
    "jsonschema>=4.26.0",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0,<0.16.0",
    "debugpy>=1.8.16",
    "mutmut>=3.7.0; python_version < '4.0'",
    "basedpyright>=1.39.10",
    "pre-commit>=4.2.0",
]

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pnpm-store",
    ".ruff_cache",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "tests/frontend",
    "tests/backend/fixtures/sideband_plugins",
    "vendor",
    "*.egg-info",
]

[tool.ruff.lint]
extend-select = ["D"]
extend-ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "D401",
]

[tool.ruff.lint.per-file-ignores]
"tests/backend/**" = ["E402"]
"cx_setup.py" = ["E402"]
"scripts/**" = ["E402"]
"meshchatx/src/backend/web_audio_bridge.py" = ["E731"]

[tool.coverage.run]
parallel = true

[tool.mutmut]
paths_to_mutate = ["meshchatx/src/backend/"]
# mutmut copies only paths_to_mutate into mutants/, then pytest runs from that
# directory. meshchatx/ then shadows the installed package as a namespace
# package, so these non-backend modules must be copied too.
also_copy = [
    "meshchatx/__init__.py",
    "meshchatx/android_codec2.py",
    "meshchatx/android_push_bridge.py",
    "meshchatx/meshchat.py",
    "meshchatx/pycodec2_ctypes.py",
    "meshchatx/repository_http_standalone.py",
    "meshchatx/src/__init__.py",
    "meshchatx/src/build_meta.py",
    "meshchatx/src/env_utils.py",
    "meshchatx/src/path_utils.py",
    "meshchatx/src/ssl_self_signed.py",
    "meshchatx/src/version.py",
]
pytest_add_cli_args = [
    "-m",
    "not integration and not long_running and not eect and not lxst_real and not live_validation",
]
pytest_add_cli_args_test_selection = [
    "tests/backend/",
    "--ignore=tests/backend/test_performance_hotpaths.py",
    "--ignore=tests/backend/test_memory_profiling.py",
    "--ignore=tests/backend/test_performance_bottlenecks.py",
    "--ignore=tests/backend/test_able_android.py",
    "--ignore=tests/backend/eect",
]

version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
      - task: common:bundle:backend
        vars:
          OS: linux
          ARCH: '{{.ARCH | default ARCH}}'
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application for Linux
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:appimage
      - task: create:deb
      - task: create:rpm
      - task: create:zip

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - |
        APP_NAME={{.APP_NAME}} \
        APP_BINARY={{.APP_BINARY}} \
        BACKEND_DIR="${BACKEND_DIR:-{{.ROOT_DIR}}/bin/backend}" \
        ICON={{.ICON}} \
        VERSION="${VERSION:-}" \
        ARCH="{{.ARCH | default ARCH}}" \
        OUT_DIR={{.ROOT_DIR}}/{{.BIN_DIR}} \
        bash build.sh
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}'
      ICON: '{{.ROOT_DIR}}/build/appicon.png'
      ROOT_DIR: '{{.ROOT_DIR}}'
      BIN_DIR: '{{.BIN_DIR}}'
      ARCH: '{{.ARCH | default ARCH}}'

  create:deb:
    summary: Creates a deb package
    preconditions:
      - sh: test -d {{.ROOT_DIR}}/bin/backend
        msg: "bin/backend missing - run 'pnpm run build-backend' at repo root, then 'cd desktop && task linux:build'"
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: generate:dotdesktop
      - task: generate:rpm

  create:zip:
    summary: Creates a portable zip (shell + backend/)
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - |
        set -e
        STAGE=/tmp/{{.APP_NAME}}-portable
        rm -rf "$STAGE" && mkdir -p "$STAGE/backend"
        cp {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}} "$STAGE/"
        if [ -d "{{.ROOT_DIR}}/bin/backend" ]; then
          cp -r {{.ROOT_DIR}}/bin/backend/. "$STAGE/backend/"
        fi
        cd /tmp && zip -qr "{{.ROOT_DIR}}/{{.BIN_DIR}}/ReticulumMeshChatX-v{{.VERSION}}-linux-{{.ARCH}}.zip" {{.APP_NAME}}-portable
        rm -rf "$STAGE"
    vars:
      VERSION:
        sh: grep -o '"version"[^,}]*' {{.ROOT_DIR}}/app-version.json | grep -o '[0-9][0-9.]*' | head -1
      ARCH: '{{.ARCH | default ARCH}}'

  generate:deb:
    summary: Creates a deb package
    deps:
      - task: generate:dotdesktop
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
    vars:
      ROOT_DIR: '{{.ROOT_DIR}}'
      APP_NAME: '{{.APP_NAME}}'

  generate:rpm:
    summary: Creates a rpm package
    deps:
      - task: generate:dotdesktop
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
    vars:
      ROOT_DIR: '{{.ROOT_DIR}}'
      APP_NAME: '{{.APP_NAME}}'

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    cmds:
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop -categories "{{.CATEGORIES}}"
      - |
        # Register the lxmf/rns URL schemes on the desktop entry.
        sed -i 's|^Categories=.*|Categories=Network;\nMimeType=x-scheme-handler/lxmf;x-scheme-handler/rns;|' {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop || true
    vars:
      ROOT_DIR: '{{.ROOT_DIR}}'
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: 'meshchatx'
      CATEGORIES: 'Network;'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

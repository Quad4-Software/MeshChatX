version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
      - task: common:bundle:backend
        vars:
          OS: windows
          ARCH: '{{.ARCH | default ARCH}}'
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application for Windows
    cmds:
      - task: create:nsis:installer
      - task: create:zip

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer (registers lxmf/rns protocol handlers)
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        V=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).version)" "{{.ROOT_DIR}}/app-version.json")
        test -n "$V" || { echo "could not resolve version from {{.ROOT_DIR}}/app-version.json" >&2; exit 1; }
        EXE="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        test -f "$EXE" || { echo "missing $EXE" >&2; ls -la "{{.ROOT_DIR}}/{{.BIN_DIR}}" >&2; exit 1; }
        EXE_W=$(node -e "console.log(process.argv[1].replace(/\//g,'\\\\'))" "$EXE")
        makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="$EXE_W" -DINFO_PRODUCTVERSION="$V" project.nsi
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      ROOT_DIR: '{{.ROOT_DIR}}'
      BIN_DIR: '{{.BIN_DIR}}'
      APP_NAME: '{{.APP_NAME}}'

  create:zip:
    summary: Creates a portable zip (shell + backend/, PORTABLE_EXECUTABLE_DIR aware)
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - |
        set -e
        V=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).version)" "{{.ROOT_DIR}}/app-version.json")
        NAME="ReticulumMeshChat-v${V}-win32-{{.ARCH}}.zip"
        STAGE="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-portable"
        rm -rf "$STAGE" && mkdir -p "$STAGE/backend"
        cp "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" "$STAGE/"
        if [ -d "{{.ROOT_DIR}}/{{.BIN_DIR}}/backend" ]; then
          cp -r "{{.ROOT_DIR}}/{{.BIN_DIR}}/backend/." "$STAGE/backend/"
        fi
        cd "{{.ROOT_DIR}}/{{.BIN_DIR}}"
        if command -v zip >/dev/null 2>&1; then
          zip -qr "$NAME" {{.APP_NAME}}-portable
        elif [ -f "C:/Program Files/7-Zip/7z.exe" ]; then
          "C:/Program Files/7-Zip/7z.exe" a -tzip "$NAME" {{.APP_NAME}}-portable >/dev/null
        elif command -v powershell.exe >/dev/null 2>&1; then
          powershell.exe -NoProfile -Command "Compress-Archive -LiteralPath \".\\{{.APP_NAME}}-portable\" -DestinationPath \".\\$NAME\" -Force"
        else
          echo "no zip-capable tool found (zip/7z/powershell)" >&2
          exit 1
        fi
        rm -rf "$STAGE"
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

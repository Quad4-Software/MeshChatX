apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: {{ include "meshchatx.fullname" . }}
    labels:
        {{- include "meshchatx.labels" . | nindent 8 }}
spec:
    serviceName: {{ include "meshchatx.fullname" . }}-headless
    replicas: 1
    selector:
        matchLabels:
            {{- include "meshchatx.selectorLabels" . | nindent 12 }}
    template:
        metadata:
            {{- with .Values.podAnnotations }}
            annotations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            labels:
                {{- include "meshchatx.selectorLabels" . | nindent 16 }}
                {{- with .Values.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
        spec:
            {{- with .Values.imagePullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            serviceAccountName: {{ include "meshchatx.serviceAccountName" . }}
            automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
            {{- if .Values.reticulum.hostNetwork }}
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            {{- end }}
            securityContext:
                {{- toYaml .Values.podSecurityContext | nindent 16 }}
            containers:
                - name: meshchatx
                  image: {{ include "meshchatx.image" . }}
                  imagePullPolicy: {{ .Values.image.pullPolicy }}
                  args:
                      {{- toYaml .Values.args | nindent 22 }}
                  {{- with .Values.extraEnv }}
                  env:
                      {{- toYaml . | nindent 22 }}
                  {{- end }}
                  ports:
                      - name: https
                        containerPort: 8000
                        protocol: TCP
                      {{- with .Values.reticulum.extraContainerPorts }}
                      {{- toYaml . | nindent 22 }}
                      {{- end }}
                  startupProbe:
                      httpGet:
                          scheme: HTTPS
                          path: /api/v1/status
                          port: https
                      periodSeconds: {{ .Values.probes.startup.periodSeconds }}
                      failureThreshold: {{ .Values.probes.startup.failureThreshold }}
                      timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
                  livenessProbe:
                      httpGet:
                          scheme: HTTPS
                          path: /api/v1/status
                          port: https
                      periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
                      timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
                      failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
                  readinessProbe:
                      httpGet:
                          scheme: HTTPS
                          path: /api/v1/status
                          port: https
                      periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
                      timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
                      failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
                  securityContext:
                      {{- toYaml .Values.securityContext | nindent 22 }}
                  resources:
                      {{- toYaml .Values.resources | nindent 22 }}
                  volumeMounts:
                      - name: config
                        mountPath: /config
                      # Container rootfs is read-only; the image expects
                      # writable /tmp and /home/meshchat (tmpfs in compose).
                      - name: tmp
                        mountPath: /tmp
                      - name: home
                        mountPath: /home/meshchat
                      {{- with .Values.extraVolumeMounts }}
                      {{- toYaml . | nindent 22 }}
                      {{- end }}
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 256Mi
                - name: home
                  emptyDir:
                      sizeLimit: 64Mi
                {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
                - name: config
                  persistentVolumeClaim:
                      claimName: {{ .Values.persistence.existingClaim }}
                {{- else if not .Values.persistence.enabled }}
                - name: config
                  emptyDir: {}
                {{- end }}
                {{- with .Values.extraVolumes }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            {{- with .Values.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
    {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
    volumeClaimTemplates:
        - metadata:
              name: config
              {{- with .Values.persistence.annotations }}
              annotations:
                  {{- toYaml . | nindent 18 }}
              {{- end }}
          spec:
              accessModes:
                  {{- toYaml .Values.persistence.accessModes | nindent 18 }}
              {{- with .Values.persistence.storageClass }}
              storageClassName: {{ . }}
              {{- end }}
              resources:
                  requests:
                      storage: {{ .Values.persistence.size }}
    {{- end }}

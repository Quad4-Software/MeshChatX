# i2pd for the MeshChatX extra image.
# SAM is for Reticulum I2PInterface. HTTP tunnel config is tunnels.conf.

log = file
loglevel = warn
ipv4 = true
ipv6 = false
notransit = true
floodfill = false

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

[http]
enabled = true
address = 127.0.0.1
port = 7070

[httpproxy]
enabled = false

[socksproxy]
enabled = false

[sam]
enabled = true
address = 127.0.0.1
port = 7656

[bob]
enabled = false

[i2cp]
enabled = false

[upnp]
enabled = false

[reseed]
verify = true

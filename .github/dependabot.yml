version: 2
# Alerts only. GitHub is CI/releases. Patches land via rngit, not Dependabot PRs.
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      versioning-strategy: increase-if-necessary
      groups:
          electron:
              patterns:
                  - electron
                  - electron-*
                  - "@electron/*"

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      # Pin slsa-github-generator by commit SHA (repo SHA-pinning required).
      # Keep compile-generator: true in callers. Ignore Dependabot bumps here;
      # bump the SHA in workflows when upgrading SLSA intentionally.
      ignore:
          - dependency-name: "slsa-framework/slsa-github-generator"
      groups:
          actions:
              patterns:
                  - actions/*
                  - docker/*
                  - github/*
                  - sigstore/*
                  - pypa/*
                  - benchmark-action/*

    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 0
      versioning-strategy: increase-if-necessary

    - package-ecosystem: gradle
      directory: /android
      schedule:
          interval: weekly
      open-pull-requests-limit: 0

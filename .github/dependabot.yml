version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      versioning-strategy: increase-if-necessary
      groups:
          electron:
              patterns:
                  - electron
                  - electron-*
                  - "@electron/*"

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          actions:
              patterns:
                  - actions/*
                  - docker/*
                  - github/*
                  - sigstore/*
                  - pypa/*
                  - benchmark-action/*
                  - slsa-framework/*

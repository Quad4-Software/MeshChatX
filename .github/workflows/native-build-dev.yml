# Native Electron builds for Windows and macOS on the dev branch.
# Split from ci.yml so docs/agent-only changes skip the ~45m macOS critical path.
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/setup-python@v6.2.0        a309ff8b426b58ec0e2a45f0f869d46889d02405
#   actions/cache@v4.2.0               1bd1e32a3bdc45362d1e726936510720a7c30a57

name: Native build (dev)

on:
    push:
        branches:
            - dev
        paths:
            - "meshchatx/**"
            - "electron/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "uv.lock"
            - "pyproject.toml"
            - "scripts/ci/github-build-windows.sh"
            - "scripts/ci/github-build-macos.sh"
            - "scripts/ci/github-install-deps.sh"
            - "scripts/ci/github-install-macos-x64-python-deps.sh"
            - "scripts/ci/github-ensure-macos-x86-64-homebrew.sh"
            - "scripts/ci/github-macos-rust-x64-target.sh"
            - "scripts/ci/macos-normalize-pycodec2-dylib.sh"
            - "scripts/unify-backend-plain-files.sh"
            - ".github/workflows/native-build-dev.yml"
            - ".github/workflows/frontend-build.yml"
            - ".github/actions/**"
    pull_request:
        branches:
            - dev
        paths:
            - "meshchatx/**"
            - "electron/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "uv.lock"
            - "pyproject.toml"
            - "scripts/ci/github-build-windows.sh"
            - "scripts/ci/github-build-macos.sh"
            - "scripts/ci/github-install-deps.sh"
            - "scripts/ci/github-install-macos-x64-python-deps.sh"
            - "scripts/ci/github-ensure-macos-x86-64-homebrew.sh"
            - "scripts/ci/github-macos-rust-x64-target.sh"
            - "scripts/ci/macos-normalize-pycodec2-dylib.sh"
            - "scripts/unify-backend-plain-files.sh"
            - ".github/workflows/native-build-dev.yml"
            - ".github/workflows/frontend-build.yml"
            - ".github/actions/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: native-dev-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NODE_OPTIONS: --max-old-space-size=8192
    PYTHON_VERSION: "3.14"
    NODE_VERSION: "24"
    UV_VERSION: "0.11.15"
    PNPM_VERSION: "11.1.2"

jobs:
    frontend:
        name: Build frontend artifact
        uses: ./.github/workflows/frontend-build.yml
        permissions:
            contents: read
        with:
            artifact_name: meshchatx-frontend-native-${{ github.run_id }}-${{ github.run_attempt }}
            retention_days: 1

    native-build:
        name: Native build (${{ matrix.label }})
        needs: frontend
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      label: windows
                      timeout: 120
                      build_script: scripts/ci/github-build-windows.sh
                    - os: macos-latest
                      label: macos
                      timeout: 180
                      build_script: scripts/ci/github-build-macos.sh
        runs-on: ${{ matrix.os }}
        timeout-minutes: ${{ matrix.timeout }}
        defaults:
            run:
                shell: bash
        env:
            FRONTEND_ARTIFACT_NAME: ${{ needs.frontend.outputs.artifact_name }}
            MESHCHATX_FRONTEND_PREBUILT: "1"
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false

            - name: Set up Python and UV
              uses: ./.github/actions/setup-python-uv
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}

            - name: Set up Node and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Cache electron-builder toolsets
              uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
              with:
                  path: ~/.cache/electron-builder
                  key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
                  restore-keys: |
                      electron-builder-${{ runner.os }}-${{ runner.arch }}-

            - name: Install dependencies
              run: bash scripts/ci/github-install-deps.sh

            - name: Install Rosetta (Apple Silicon)
              if: matrix.label == 'macos'
              run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true

            - name: Ensure x86_64 Homebrew (/usr/local) for universal slice
              if: matrix.label == 'macos'
              run: bash scripts/ci/github-ensure-macos-x86-64-homebrew.sh

            - name: Set up Python x64 for cx_Freeze universal slice
              id: python_x64
              if: matrix.label == 'macos'
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  architecture: x64
                  update-environment: false

            - name: Install x86_64 codec2 for pycodec2 (universal slice)
              if: matrix.label == 'macos'
              run: |
                  set -euo pipefail
                  arch -x86_64 /usr/local/bin/brew install codec2

            - name: Install Rust x86_64-apple-darwin target (cbor2 x64 slice)
              if: matrix.label == 'macos'
              run: bash scripts/ci/github-macos-rust-x64-target.sh

            - name: Install project deps into x64 Python (mac universal cx_Freeze)
              if: matrix.label == 'macos'
              env:
                  PY_X64: ${{ steps.python_x64.outputs.python-path }}
              run: bash scripts/ci/github-install-macos-x64-python-deps.sh

            - name: Fetch frontend artifact
              uses: ./.github/actions/fetch-frontend-artifact
              with:
                  artifact-name: ${{ env.FRONTEND_ARTIFACT_NAME }}

            - name: Build distributables
              run: bash "${{ matrix.build_script }}"

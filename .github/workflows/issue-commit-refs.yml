# Comment on open issues referenced by fix-style commit messages pushed to a
# release line. GitHub already auto-closes issues on the default branch, but
# fixes land on dev/next first, where nothing tells the reporter progress
# happened. A single comment per commit sha keeps the thread honest without
# spamming: repeated pushes of the same commit are deduplicated.

name: Issue commit references

on:
    push:
        branches:
            - master
            - dev
            - next

permissions:
    issues: write

env:
    HARDEN_ENDPOINTS: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        uploads.github.com:443
        *.githubusercontent.com:443
        *.actions.githubusercontent.com:443
        *.githubapp.com:443
        *.blob.core.windows.net:443
        ghcr.io:443
        azure.archive.ubuntu.com:80
        archive.ubuntu.com:80
        *.ubuntu.com:443
        packages.microsoft.com:443
        pypi.org:443
        upload.pypi.org:443
        *.pythonhosted.org:443
        registry.npmjs.org:443
        nodejs.org:443
        proxy.golang.org:443
        sum.golang.org:443
        sh.rustup.rs:443
        static.rust-lang.org:443
        static.crates.io:443
        index.crates.io:443
        api.adoptium.net:443
        dl.google.com:443
        maven.google.com:443
        repo.maven.apache.org:443
        services.gradle.org:443
        repo.gradle.org:443
        plugins.gradle.org:443
        chaquo.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        download.docker.com:443
        production.cloudfront.docker.com:443
        mirror.gcr.io:443
        *.sigstore.dev:443
        check.trivy.dev:443
        cgr.dev:443
        *.cgr.dev:443
        dl-cdn.alpinelinux.org:443
        *.alpinelinux.org:443
        *.r2.cloudflarestorage.com:443
        *.storage.bunnycdn.com:443
        cdn.quad4.io:443
        dl.flathub.org:443
        flathub.org:443
        api.securityscorecards.dev:443
        meshchatx.com:443
        cdn.playwright.dev:443
        playwright.download.prss.microsoft.com:443
        *.prss.microsoft.com:443
        firefox.settings.services.mozilla.com:443
        *.mozilla.com:443
        storage.googleapis.com:443
        *.stepsecurity.io:443
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    reference:
        if: github.repository == 'Quad4-Software/MeshChatX'
        runs-on: ubuntu-latest
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Comment on referenced open issues
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  COMMITS: ${{ toJSON(github.event.commits) }}
                  BRANCH: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  commented=0
                  while IFS=$'\t' read -r sha subject; do
                      [ -n "$sha" ] || continue
                      nums="$(printf '%s' "$subject" | grep -oE \
                          '#[0-9]+' | grep -oE '[0-9]+' | sort -u)" || true
                      for n in $nums; do
                          [ "$commented" -ge 10 ] && exit 0
                          info="$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" \
                              --jq '{state, pr: has("pull_request")}' 2>/dev/null)" || continue
                          [ "$(jq -r .state <<<"$info")" = "open" ] || continue
                          [ "$(jq -r .pr <<<"$info")" = "false" ] || continue
                          already="$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" \
                              --paginate \
                              | jq --arg sha "$sha" '[.[].body | contains($sha)] | any')" || continue
                          [ "$already" = "true" ] && continue
                          gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body \
                              "Referenced by commit \`${sha:0:10}\` on \`$BRANCH\`: ${subject}. If this resolves the issue it will be included in the next release."
                          commented=$((commented + 1))
                      done
                  done < <(printf '%s' "$COMMITS" | jq -r '.[] | [.id, (.message | split("\n")[0])] | @tsv')
                  echo "commented on $commented issue(s)"

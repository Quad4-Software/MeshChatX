# Weekly preview builds from master: push a preview-* tag when master has new
# commits since the last prerelease, which triggers build-release.yml.
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#
name: Preview Release

on:
    schedule:
        - cron: "0 6 * * 0"
    workflow_dispatch:

concurrency:
    group: preview-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    metadata:
        name: Prepare preview tag
        runs-on: ubuntu-latest
        outputs:
            tag_name: ${{ steps.meta.outputs.tag_name }}
            commit_sha: ${{ steps.meta.outputs.commit_sha }}
            skip_release: ${{ steps.meta.outputs.skip_release }}
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: master
                  fetch-depth: 0

            - name: Compute preview tag
              id: meta
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  short_sha="$(git rev-parse --short=7 HEAD)"
                  full_sha="$(git rev-parse HEAD)"
                  tag="preview-$(date -u +%Y.%m.%d)-${short_sha}"

                  skip_release=false
                  if [ "${{ github.event_name }}" = "schedule" ]; then
                    last_preview_tag="$(gh release list --limit 50 --json tagName,isPrerelease \
                      --jq '[.[] | select(.isPrerelease) | select(.tagName | startswith("preview-")) | select(.tagName | startswith("preview-dev-") | not)][0].tagName // empty')"
                    last_preview_sha=""
                    if [ -n "${last_preview_tag}" ]; then
                      git fetch --tags --force origin
                      last_preview_sha="$(git rev-parse "refs/tags/${last_preview_tag}^{commit}" 2>/dev/null || true)"
                    fi
                    if [ -n "${last_preview_sha}" ] && [ "${last_preview_sha}" = "${full_sha}" ]; then
                      echo "No new commits on master since last preview (${last_preview_tag} @ ${last_preview_sha}); skipping scheduled release."
                      skip_release=true
                    fi
                  fi

                  echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
                  echo "commit_sha=${full_sha}" >> "$GITHUB_OUTPUT"
                  echo "skip_release=${skip_release}" >> "$GITHUB_OUTPUT"
                  echo "Preview tag: ${tag} @ ${full_sha} (skip_release=${skip_release})"

    tag:
        name: Tag master and trigger build-release
        needs: metadata
        if: needs.metadata.outputs.skip_release != 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: master
                  fetch-depth: 0

            - name: Create and push preview tag
              env:
                  TAG: ${{ needs.metadata.outputs.tag_name }}
                  SHA: ${{ needs.metadata.outputs.commit_sha }}
              run: |
                  set -euo pipefail
                  if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
                    echo "Tag ${TAG} already exists; skipping push."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "${TAG}" -m "Weekly preview build for ${SHA}" "${SHA}"
                  git push origin "${TAG}"

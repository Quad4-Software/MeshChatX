# Testing channel builds from master: push a nightly-* tag when master has
# new commits since the last Testing prerelease, then dispatch build-release.yml.
# Tag push alone does not start other workflows when using GITHUB_TOKEN
# (GitHub Actions event loop prevention). Workflow_dispatch is required.
#
# Product channel: Testing. Tag prefix stays nightly-* for download URL stability.
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#
name: Testing Release

on:
    schedule:
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: testing-release
    cancel-in-progress: false

permissions:
    contents: read

env:
    HARDEN_ENDPOINTS: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        uploads.github.com:443
        *.githubusercontent.com:443
        *.actions.githubusercontent.com:443
        *.githubapp.com:443
        *.blob.core.windows.net:443
        ghcr.io:443
        azure.archive.ubuntu.com:80
        archive.ubuntu.com:80
        *.ubuntu.com:443
        deb.debian.org:80
        deb.debian.org:443
        security.debian.org:80
        security.debian.org:443
        *.debian.org:80
        *.debian.org:443
        packages.microsoft.com:443
        pypi.org:443
        upload.pypi.org:443
        *.pythonhosted.org:443
        registry.npmjs.org:443
        nodejs.org:443
        proxy.golang.org:443
        sum.golang.org:443
        sh.rustup.rs:443
        static.rust-lang.org:443
        static.crates.io:443
        index.crates.io:443
        api.adoptium.net:443
        dl.google.com:443
        maven.google.com:443
        repo.maven.apache.org:443
        services.gradle.org:443
        repo.gradle.org:443
        plugins.gradle.org:443
        chaquo.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        download.docker.com:443
        production.cloudfront.docker.com:443
        mirror.gcr.io:443
        *.sigstore.dev:443
        check.trivy.dev:443
        cgr.dev:443
        *.cgr.dev:443
        dl-cdn.alpinelinux.org:443
        *.alpinelinux.org:443
        *.r2.cloudflarestorage.com:443
        *.storage.bunnycdn.com:443
        cdn.quad4.io:443
        dl.flathub.org:443
        flathub.org:443
        api.securityscorecards.dev:443
        meshchatx.com:443
        cdn.playwright.dev:443
        playwright.download.prss.microsoft.com:443
        *.prss.microsoft.com:443
        firefox.settings.services.mozilla.com:443
        *.mozilla.com:443
        storage.googleapis.com:443
        *.stepsecurity.io:443
    PYTHON_VERSION: "3.14"
    UV_VERSION: "0.11.15"

jobs:
    metadata:
        name: Prepare Testing tag
        runs-on: ubuntu-latest
        outputs:
            tag_name: ${{ steps.meta.outputs.tag_name }}
            commit_sha: ${{ steps.meta.outputs.commit_sha }}
            skip_release: ${{ steps.meta.outputs.skip_release }}
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: master
                  fetch-depth: 0
                  persist-credentials: false

            - name: Compute Testing tag
              id: meta
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  short_sha="$(git rev-parse --short=7 HEAD)"
                  full_sha="$(git rev-parse HEAD)"
                  tag="nightly-$(date -u +%Y.%m.%d)-${short_sha}"

                  skip_release=false
                  if [ "${{ github.event_name }}" = "schedule" ]; then
                    last_testing_tag="$(gh release list --limit 50 --json tagName,isPrerelease \
                      --jq '[.[] | select(.isPrerelease) | select(.tagName | startswith("nightly-") or startswith("testing-"))][0].tagName // empty')"
                    last_testing_sha=""
                    if [ -n "${last_testing_tag}" ]; then
                      git fetch --tags --force origin
                      last_testing_sha="$(git rev-parse "refs/tags/${last_testing_tag}^{commit}" 2>/dev/null || true)"
                    fi
                    if [ -n "${last_testing_sha}" ] && [ "${last_testing_sha}" = "${full_sha}" ]; then
                      echo "No new commits on master since last Testing release (${last_testing_tag} @ ${last_testing_sha}); skipping scheduled release."
                      skip_release=true
                    fi
                  fi

                  echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
                  echo "commit_sha=${full_sha}" >> "$GITHUB_OUTPUT"
                  echo "skip_release=${skip_release}" >> "$GITHUB_OUTPUT"
                  echo "Testing tag: ${tag} @ ${full_sha} (skip_release=${skip_release})"

    tag:
        name: Tag master and dispatch build-release
        needs: metadata
        if: needs.metadata.outputs.skip_release != 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: master
                  fetch-depth: 0
                  # Tag push needs the persisted token (git push origin).
                  persist-credentials: true

            - name: Create and push Testing tag
              env:
                  TAG: ${{ needs.metadata.outputs.tag_name }}
                  SHA: ${{ needs.metadata.outputs.commit_sha }}
              run: |
                  set -euo pipefail
                  if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
                    echo "Tag ${TAG} already exists; skipping push."
                  else
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git tag -a "${TAG}" -m "Testing build for ${SHA}" "${SHA}"
                    git push origin "${TAG}"
                  fi

            - name: Dispatch build-release for tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.metadata.outputs.tag_name }}
                  SHA: ${{ needs.metadata.outputs.commit_sha }}
              run: |
                  set -euo pipefail
                  for attempt in 1 2 3 4 5; do
                    if gh workflow run build-release.yml --ref "refs/tags/${TAG}"; then
                      echo "Dispatched build-release.yml for ref ${TAG} (${SHA})"
                      exit 0
                    fi
                    echo "Dispatch attempt ${attempt} failed; waiting for tag to propagate..."
                    sleep 5
                  done
                  echo "Failed to dispatch build-release.yml for ${TAG}" >&2
                  exit 1

    prune:
        name: Prune old Testing prereleases
        needs: tag
        if: always() && needs.tag.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: master
                  persist-credentials: false

            - name: Keep newest Testing prereleases
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MESHCHATX_KEEP_TESTING: "7"
                  MESHCHATX_KEEP_BETA: "5"
              run: bash scripts/ci/github-prune-channel-prereleases.sh

    reproducibility:
        name: Reproducible wheel build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: master
                  persist-credentials: false
            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
            - name: Build wheel twice and compare hashes
              run: bash scripts/ci/reproducible-check.sh

    devcontainer-smoke:
        name: Offline dev container build
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: master
                  persist-credentials: false
            - name: Build Dockerfile.dev
              run: docker build -f docker/Dockerfile.dev -t meshchatx-dev:ci .

    ci-metrics:
        name: CI metrics summary
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            actions: read
            contents: read
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  ref: master
                  persist-credentials: false
            - name: Summarize workflow durations and failure rates
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  METRICS_DAYS: "7"
              run: bash scripts/ci/workflow-metrics.sh

# Build a signed OSTree Flatpak repository and publish it to GitHub Pages.
# Tagged releases import the electron-builder bundle, preserve prior ostree
# commits from the live site when present, and deploy meshchatx.flatpakref.
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/setup-python@v6.2.0        a309ff8b426b58ec0e2a45f0f869d46889d02405
#   actions/upload-artifact@v5.0.0     330a01c490aca151604b8cf639adc76d48f6c5d4
#   actions/download-artifact@v5.0.0   634f93cb2916e3fdff6788551b99b062d0335ce0
#   actions/cache@v4.2.0               1bd1e32a3bdc45362d1e726936510720a7c30a57
#   actions/upload-pages-artifact@v3   56afc609e74202658d3ffba0e8f6dda462b719fa
#   actions/deploy-pages@v4            d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
#   crazy-max/ghaction-import-gpg@v6   e89d40939c28e39f97cf32126055eeae86ba74ec

name: Flatpak repository (Pages)

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: flatpak-pages
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NODE_OPTIONS: --max-old-space-size=8192
    PYTHON_VERSION: "3.14"
    NODE_VERSION: "24"
    UV_VERSION: "0.11.15"
    PNPM_VERSION: "11.1.2"

jobs:
    frontend:
        name: Build frontend artifact
        uses: ./.github/workflows/frontend-build.yml
        permissions:
            contents: read
        with:
            artifact_name: meshchatx-frontend-flatpak-pages-${{ github.run_id }}-${{ github.run_attempt }}
            retention_days: 7
            pnpm_version: "11.1.2"

    build:
        name: Build and export Flatpak ostree repo
        needs: frontend
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
        env:
            FRONTEND_ARTIFACT_NAME: ${{ needs.frontend.outputs.artifact_name }}
            MESHCHATX_FRONTEND_PREBUILT: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

            - name: Install flatpak toolchain
              run: |
                  set -euo pipefail
                  sudo apt-get update -y
                  sudo apt-get install -y --no-install-recommends \
                      flatpak \
                      flatpak-builder \
                      ostree \
                      elfutils \
                      zstd \
                      desktop-file-utils \
                      appstream

            - name: Install flatpak runtimes (user scope)
              run: |
                  set -euo pipefail
                  bash scripts/ensure-flatpak-flathub-remote.sh
                  flatpak --user install -y --noninteractive flathub \
                      org.freedesktop.Platform//25.08 \
                      org.freedesktop.Sdk//25.08 \
                      org.electronjs.Electron2.BaseApp//25.08

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install UV (PyPI pin)
              env:
                  UV_VERSION: ${{ env.UV_VERSION }}
              run: bash scripts/ci/github-install-uv.sh

            - name: Cache UV downloads
              uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
              with:
                  path: ~/.cache/uv
                  key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-uv-

            - name: Set up Node and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Install dependencies
              run: bash scripts/ci/github-install-deps.sh

            - name: Download frontend artifact
              uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
              with:
                  name: ${{ env.FRONTEND_ARTIFACT_NAME }}
                  path: meshchatx/public

            - name: Verify frontend artifact contents
              run: |
                  set -euo pipefail
                  test -f meshchatx/public/index.html
                  test -d meshchatx/public/assets
                  test -d meshchatx/public/reticulum-docs-bundled/current

            # secrets cannot appear in if: expressions, so import is optional via continue-on-error
            - name: Import Flatpak GPG key
              id: gpg
              continue-on-error: true
              uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec
              with:
                  gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

            - name: Build flatpak bundle
              run: bash scripts/ci/github-build-linux-flatpak.sh

            - name: Export ostree repo for Pages
              env:
                  GPG_FINGERPRINT: ${{ steps.gpg.outcome == 'success' && steps.gpg.outputs.fingerprint || '' }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  bundles=(dist/*.flatpak)
                  if [[ ${#bundles[@]} -eq 0 ]]; then
                      echo "No .flatpak under dist/" >&2
                      exit 1
                  fi
                  bash scripts/ci/github-flatpak-pages-export.sh "${bundles[0]}" pages

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
              with:
                  path: pages

    deploy:
        name: Deploy Flatpak repo to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

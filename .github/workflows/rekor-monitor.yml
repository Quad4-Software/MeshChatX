# Cross-run Rekor checkpoint persistence uses Sigstore's reusable workflow (Actions artifact).
name: Rekor log monitor

on:
    schedule:
        - cron: "17 11 * * 1"
    workflow_dispatch:

concurrency:
    group: rekor-monitor
    cancel-in-progress: false

permissions:
    contents: read
    issues: write

jobs:
    rekor:
        uses: sigstore/rekor-monitor/.github/workflows/reusable_monitoring.yml@fe1cc6c79f46fe1d4acbc7f3d2975586af83cd34
        secrets: inherit
        with:
            file_issue: true
            artifact_retention_days: 30

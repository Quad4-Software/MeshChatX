# Promote a SHA to Beta or Stable (Testing -> Beta -> Stable).
# Rebuilds under a new tag so channel bake flips correctly. Never copies assets
# across tags/run_ids (immutable release model).
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#
name: Promote Release

on:
    workflow_dispatch:
        inputs:
            sha:
                description: Full git commit SHA to promote
                required: true
            channel:
                description: Target channel
                required: true
                type: choice
                options:
                    - beta
                    - stable
            version:
                description: Stable semver without v prefix (required for stable, e.g. 1.2.3)
                required: false
                default: ""
            beta_suffix:
                description: Optional beta tag suffix (default YYYY.MM.DD-sha7)
                required: false
                default: ""

concurrency:
    group: promote-release-${{ inputs.channel }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    HARDEN_ENDPOINTS: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        uploads.github.com:443
        *.githubusercontent.com:443
        *.actions.githubusercontent.com:443
        *.githubapp.com:443
        *.blob.core.windows.net:443
        ghcr.io:443
        azure.archive.ubuntu.com:80
        archive.ubuntu.com:80
        *.ubuntu.com:443
        packages.microsoft.com:443
        pypi.org:443
        upload.pypi.org:443
        *.pythonhosted.org:443
        registry.npmjs.org:443
        nodejs.org:443
        proxy.golang.org:443
        sum.golang.org:443
        sh.rustup.rs:443
        static.rust-lang.org:443
        static.crates.io:443
        index.crates.io:443
        api.adoptium.net:443
        dl.google.com:443
        maven.google.com:443
        repo.maven.apache.org:443
        services.gradle.org:443
        repo.gradle.org:443
        plugins.gradle.org:443
        chaquo.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        download.docker.com:443
        production.cloudfront.docker.com:443
        mirror.gcr.io:443
        *.sigstore.dev:443
        check.trivy.dev:443
        cgr.dev:443
        *.cgr.dev:443
        dl-cdn.alpinelinux.org:443
        *.alpinelinux.org:443
        *.r2.cloudflarestorage.com:443
        *.storage.bunnycdn.com:443
        cdn.quad4.io:443
        dl.flathub.org:443
        flathub.org:443
        api.securityscorecards.dev:443
        meshchatx.com:443
        cdn.playwright.dev:443
        playwright.download.prss.microsoft.com:443
        *.prss.microsoft.com:443
        firefox.settings.services.mozilla.com:443
        *.mozilla.com:443
        storage.googleapis.com:443
        *.stepsecurity.io:443

jobs:
    promote:
        name: Tag and dispatch build-release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  fetch-depth: 0
                  # Tag push needs the persisted token (git push origin).
                  persist-credentials: true

            - name: Create tag and dispatch
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ inputs.sha }}
                  CHANNEL: ${{ inputs.channel }}
                  VERSION: ${{ inputs.version }}
                  BETA_SUFFIX: ${{ inputs.beta_suffix }}
              run: |
                  set -euo pipefail
                  if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
                    git fetch --all --tags
                  fi
                  full_sha="$(git rev-parse "${SHA}^{commit}")"
                  short_sha="$(git rev-parse --short=7 "${full_sha}")"

                  if [ "${CHANNEL}" = "stable" ]; then
                    if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Stable promote requires version like 1.2.3 (got '${VERSION}')" >&2
                      exit 1
                    fi
                    tag="v${VERSION}"
                  else
                    if [ -n "${BETA_SUFFIX}" ]; then
                      tag="beta-${BETA_SUFFIX}"
                    else
                      tag="beta-$(date -u +%Y.%m.%d)-${short_sha}"
                    fi
                  fi

                  if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
                    echo "Tag ${tag} already exists" >&2
                    exit 1
                  fi

                  # GITHUB_TOKEN cannot git-push a ref whose workflow files
                  # differ from the default branch (needs workflows scope).
                  # Create the tag through the git data API, which does not
                  # go through receive-pack and so skips that check.
                  tag_object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
                    -f tag="${tag}" \
                    -f message="Promote ${CHANNEL} for ${full_sha}" \
                    -f object="${full_sha}" \
                    -f type="commit" \
                    --jq '.sha')"
                  gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                    -f ref="refs/tags/${tag}" \
                    -f sha="${tag_object_sha}"

                  build_dispatched=false
                  for attempt in 1 2 3 4 5; do
                    if gh workflow run build-release.yml --ref "refs/tags/${tag}"; then
                      echo "Dispatched build-release.yml for ${tag} (${full_sha})"
                      build_dispatched=true
                      break
                    fi
                    echo "Dispatch attempt ${attempt} failed; waiting..."
                    sleep 5
                  done
                  if [ "$build_dispatched" != "true" ]; then
                    echo "Failed to dispatch build-release.yml for ${tag}" >&2
                    exit 1
                  fi

                  if [ "${CHANNEL}" = "stable" ]; then
                    for attempt in 1 2 3 4 5; do
                      if gh workflow run pypi.yml --ref "refs/tags/${tag}"; then
                        echo "Dispatched pypi.yml for ${tag} (${full_sha})"
                        exit 0
                      fi
                      echo "PyPI dispatch attempt ${attempt} failed; waiting..."
                      sleep 5
                    done
                    echo "Failed to dispatch pypi.yml for ${tag}" >&2
                    exit 1
                  fi

# Promote a known-good SHA to Beta or Stable (Testing -> Beta -> Stable).
# Rebuilds under a new tag so channel bake flips correctly. Never copies assets
# across tags/run_ids (immutable release model).
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#
name: Promote Release

on:
    workflow_dispatch:
        inputs:
            sha:
                description: Full git commit SHA to promote
                required: true
            channel:
                description: Target channel
                required: true
                type: choice
                options:
                    - beta
                    - stable
            version:
                description: Stable semver without v prefix (required for stable, e.g. 4.9.0)
                required: false
                default: ""
            beta_suffix:
                description: Optional beta tag suffix (default YYYY.MM.DD-sha7)
                required: false
                default: ""

concurrency:
    group: promote-release-${{ inputs.channel }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    promote:
        name: Tag and dispatch build-release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  fetch-depth: 0

            - name: Require CI green, create tag, dispatch
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ inputs.sha }}
                  CHANNEL: ${{ inputs.channel }}
                  VERSION: ${{ inputs.version }}
                  BETA_SUFFIX: ${{ inputs.beta_suffix }}
              run: |
                  set -euo pipefail
                  if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
                    git fetch --all --tags
                  fi
                  full_sha="$(git rev-parse "${SHA}^{commit}")"
                  short_sha="$(git rev-parse --short=7 "${full_sha}")"
                  bash scripts/ci/github-require-ci-green.sh "${full_sha}"

                  if [ "${CHANNEL}" = "stable" ]; then
                    if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Stable promote requires version like 4.9.0 (got '${VERSION}')" >&2
                      exit 1
                    fi
                    tag="v${VERSION}"
                  else
                    if [ -n "${BETA_SUFFIX}" ]; then
                      tag="beta-${BETA_SUFFIX}"
                    else
                      tag="beta-$(date -u +%Y.%m.%d)-${short_sha}"
                    fi
                  fi

                  if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
                    echo "Tag ${tag} already exists" >&2
                    exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "${tag}" -m "Promote ${CHANNEL} for ${full_sha}" "${full_sha}"
                  git push origin "${tag}"

                  for attempt in 1 2 3 4 5; do
                    if gh workflow run build-release.yml --ref "refs/tags/${tag}"; then
                      echo "Dispatched build-release.yml for ${tag} (${full_sha})"
                      exit 0
                    fi
                    echo "Dispatch attempt ${attempt} failed; waiting..."
                    sleep 5
                  done
                  echo "Failed to dispatch build-release.yml for ${tag}" >&2
                  exit 1

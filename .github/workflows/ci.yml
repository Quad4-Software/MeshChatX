# Primary CI: lint, tests, localization, Linux build check, E2E (master).
# Native Windows/macOS Electron builds run on demand via native-build-dev.yml.
# Verify matrix steps delegate to Taskfile.yml (task lint, test:frontend, test:lang).
# Live LXMF local-TCP suite: task test:lxmf:live (MESHCHAT_LIVE_RETICULUM=1).
#
# The frontend bundle is built once via the reusable frontend-build workflow and
# downloaded by downstream jobs instead of rebuilding on every runner.
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1        5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0     cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2   9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2            b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   actions/cache@v4.2.0               55cc8345863c7cc4c66a329aec7e433d2d1c52a9

name: CI

on:
    push:
        branches:
            - master
        paths-ignore:
            - "docs/**"
            - ".cursor/**"
            - "**/*.md"
    pull_request:
        branches:
            - master
        paths-ignore:
            - "docs/**"
            - ".cursor/**"
            - "**/*.md"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    HARDEN_ENDPOINTS: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        uploads.github.com:443
        release-assets.githubusercontent.com:443
        *.githubusercontent.com:443
        *.actions.githubusercontent.com:443
        *.githubapp.com:443
        *.blob.core.windows.net:443
        ghcr.io:443
        azure.archive.ubuntu.com:80
        archive.ubuntu.com:80
        *.ubuntu.com:443
        packages.microsoft.com:443
        pypi.org:443
        upload.pypi.org:443
        *.pythonhosted.org:443
        registry.npmjs.org:443
        nodejs.org:443
        proxy.golang.org:443
        sum.golang.org:443
        sh.rustup.rs:443
        static.rust-lang.org:443
        static.crates.io:443
        index.crates.io:443
        api.adoptium.net:443
        dl.google.com:443
        maven.google.com:443
        repo.maven.apache.org:443
        services.gradle.org:443
        repo.gradle.org:443
        plugins.gradle.org:443
        chaquo.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        download.docker.com:443
        production.cloudfront.docker.com:443
        mirror.gcr.io:443
        *.sigstore.dev:443
        check.trivy.dev:443
        cgr.dev:443
        *.cgr.dev:443
        dl-cdn.alpinelinux.org:443
        *.alpinelinux.org:443
        *.r2.cloudflarestorage.com:443
        dl.flathub.org:443
        flathub.org:443
        api.securityscorecards.dev:443
        meshchatx.com:443
        cdn.playwright.dev:443
        playwright.download.prss.microsoft.com:443
        *.prss.microsoft.com:443
        firefox.settings.services.mozilla.com:443
        *.mozilla.com:443
        storage.googleapis.com:443
        *.stepsecurity.io:443
        archlinux.org:443
        geo.mirror.pkgbuild.com:443
        ziglang.org:443
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NODE_OPTIONS: --max-old-space-size=8192
    PYTHON_VERSION: "3.15"
    NODE_VERSION: "24"
    UV_VERSION: "0.13.5"
    PNPM_VERSION: "12.15.0"
    GO_VERSION: "1.27.x"
    TINYGO_VERSION: "0.44.0"
    RNS_REQUIRED_SIGNER: e46112d44649266d71fe2193e00a4710

jobs:
    frontend:
        name: Build frontend artifact
        uses: $/.github/workflows/frontend-build.yml
        permissions:
            contents: read
        with:
            artifact_name: meshchatx-frontend-ci-${{ github.run_id }}-${{ github.run_attempt }}
            retention_days: 1

    verify:
        name: ${{ matrix.task.name }}
        runs-on: self-hosted
        timeout-minutes: ${{ matrix.task.timeout }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                task:
                    - name: Lint
                      id: lint
                      timeout: 45
                    - name: Frontend tests
                      id: frontend-tests
                      timeout: 45
                    - name: Localization tests
                      id: lang-tests
                      timeout: 20
                    - name: License audit
                      id: license-audit
                      timeout: 10
                    - name: Docs mirror
                      id: docs-mirror
                      timeout: 10

        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Run matrix task
              env:
                  PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  set -euo pipefail
                  case "${{ matrix.task.id }}" in
                    lint)
                      task lint
                      pnpm run brand:check
                      ;;
                    frontend-tests)
                      task test:frontend
                      ;;
                    lang-tests)
                      task test:lang
                      ;;
                    license-audit)
                      uv run python scripts/ci/license-check.py
                      ;;
                    docs-mirror)
                      node scripts/sync-meshchatx-docs.js
                      if ! git diff --exit-code --quiet -- meshchatx/src/frontend/public/meshchatx-docs; then
                        echo "::error::meshchatx-docs mirror is out of date. Run: node scripts/sync-meshchatx-docs.js"
                        exit 1
                      fi
                      ;;
                    *)
                      echo "Unknown matrix task: ${{ matrix.task.id }}" >&2
                      exit 1
                      ;;
                  esac

            - name: Verify workspace clean
              uses: $/.github/actions/verify-workspace-clean

    visualiser-wasm:
        name: Visualiser WASM (Go)
        runs-on: self-hosted
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              env:
                  # Self-hosted runners may lack /tmp entirely; Go builds its
                  # work dir under os.TempDir() which honours TMPDIR.
                  TMPDIR: ${{ runner.temp }}
              with:
                  go-version: ${{ env.GO_VERSION }}

            - name: Remove stale corepack shims
              run: |
                  for d in "${RUNNER_TOOL_CACHE:-}/node"/*/*/bin; do
                      [ -d "$d" ] || continue
                      rm -f "$d/yarn" "$d/yarnpkg" "$d/pnpm" "$d/pnpx" "$d/pn" "$d/px"
                  done

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: "24"

            - name: Install TinyGo
              run: sh scripts/ci/setup-tinygo.sh ${{ env.TINYGO_VERSION }}

            - name: Setup Task
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: sh scripts/ci/setup-task.sh 3.54.0

            - name: Run visualiser-wasm tests
              run: task test:visualiser-wasm

            - name: Build visualiser-wasm artifacts
              run: task build:visualiser-wasm

            - name: Verify integrity.json stamped
              run: |
                  set -euo pipefail
                  test -f meshchatx/src/frontend/public/vendor/visualiser-wasm/integrity.json
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  data = json.loads(Path("meshchatx/src/frontend/public/vendor/visualiser-wasm/integrity.json").read_text())
                  assert data.get("version") == "1.2.0", data
                  assert str(data.get("wasm", "")).startswith("sha384-"), data
                  assert str(data.get("wasmExec", "")).startswith("sha384-"), data
                  print("visualiser-wasm integrity OK", data["version"])
                  PY

    geo-wasm:
        name: Geo WASM (Go)
        runs-on: self-hosted
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              env:
                  # Self-hosted runners may lack /tmp entirely; Go builds its
                  # work dir under os.TempDir() which honours TMPDIR.
                  TMPDIR: ${{ runner.temp }}
              with:
                  go-version: ${{ env.GO_VERSION }}

            - name: Remove stale corepack shims
              run: |
                  for d in "${RUNNER_TOOL_CACHE:-}/node"/*/*/bin; do
                      [ -d "$d" ] || continue
                      rm -f "$d/yarn" "$d/yarnpkg" "$d/pnpm" "$d/pnpx" "$d/pn" "$d/px"
                  done

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: "24"

            - name: Install TinyGo
              run: sh scripts/ci/setup-tinygo.sh ${{ env.TINYGO_VERSION }}

            - name: Setup Task
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: sh scripts/ci/setup-task.sh 3.54.0

            - name: Run geo-wasm tests
              run: task test:geo-wasm

            - name: Build geo-wasm artifacts
              run: task build:geo-wasm

            - name: Verify integrity.json stamped
              run: |
                  set -euo pipefail
                  test -f meshchatx/src/frontend/public/vendor/geo-wasm/integrity.json
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  data = json.loads(Path("meshchatx/src/frontend/public/vendor/geo-wasm/integrity.json").read_text())
                  assert data.get("version") == "1.0.0", data
                  assert str(data.get("wasm", "")).startswith("sha384-"), data
                  assert str(data.get("wasmExec", "")).startswith("sha384-"), data
                  print("geo-wasm integrity OK", data["version"])
                  PY

    backend-tests:
        name: Backend tests (Python 3.15) - Shard ${{ matrix.shard }} / 4
        runs-on: self-hosted
        timeout-minutes: 20
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3]
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  install-node: "false"

            - name: Remove stale corepack shims
              run: |
                  for d in "${RUNNER_TOOL_CACHE:-}/node"/*/*/bin; do
                      [ -d "$d" ] || continue
                      rm -f "$d/yarn" "$d/yarnpkg" "$d/pnpm" "$d/pnpx" "$d/pn" "$d/px"
                  done

            - name: Set up Node (backend tests invoke node scripts)
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: "24"

            - name: Run backend tests
              env:
                  PYTEST_SHARD_INDEX: ${{ matrix.shard }}
                  PYTEST_TOTAL_SHARDS: 4
                  # One retry max: absorbs single flakes without hiding real
                  # intermittency. Rerun counts surface via -rR in the log.
                  # Coverage data is collected per shard and merged by the
                  # backend-coverage job instead of re-running the suite.
                  PYTEST_ARGS: --reruns 1 -rR --cov=meshchatx/src/backend --cov-report=
              run: task test:backend

            - name: Verify workspace clean
              uses: $/.github/actions/verify-workspace-clean

            - name: Upload shard coverage data
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: backend-coverage-shard-${{ matrix.shard }}
                  path: temp-tests/coverage/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 1

    backend-coverage:
        name: Backend coverage floor
        runs-on: self-hosted
        timeout-minutes: 30
        needs: backend-tests
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  install-node: "false"

            - name: Download shard coverage data
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  pattern: backend-coverage-shard-*
                  path: temp-tests/coverage
                  merge-multiple: true

            - name: Combine coverage and enforce floors
              env:
                  # Ratchet: raise this when measured coverage improves.
                  COVERAGE_FLOOR: "59"
              run: task test:be:cov:combine

            - name: Diff coverage gate on changed lines
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  set -euo pipefail
                  git fetch origin "$BASE_REF"
                  uv run diff-cover coverage.xml \
                      --compare-branch="origin/$BASE_REF" \
                      --fail-under=80 \
                      --markdown-report diff-cover-report.md
                  cat diff-cover-report.md >> "$GITHUB_STEP_SUMMARY"

    zizmor:
        name: Workflow audit (zizmor)
        runs-on: self-hosted
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  install-node: "false"

            - name: Audit workflow files
              run: uvx zizmor@1.30.1 --min-severity medium --format plain .github/workflows/

    quarantined-tests:
        name: Quarantined backend tests (non-gating)
        if: github.event_name != 'pull_request'
        runs-on: self-hosted
        timeout-minutes: 20
        continue-on-error: true
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  install-node: "false"

            - name: Run quarantined tests
              # Exit 5 = no quarantined tests collected, which is success.
              run: |
                  task schema-fixtures
                  set +e
                  uv run pytest tests/backend -n auto -m quarantine --reruns 1 -rR
                  code=$?
                  set -e
                  if [ "$code" -eq 5 ]; then
                    echo "No quarantined tests."
                    exit 0
                  fi
                  exit "$code"

    lxmf-live-local:
        name: Live LXMF (local TCP + pack/reject)
        runs-on: self-hosted
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  install-node: "false"

            - name: Run live LXMF local suites
              run: task test:lxmf:live

            - name: Verify workspace clean
              uses: $/.github/actions/verify-workspace-clean

    build-check:
        name: Linux build check
        runs-on: self-hosted
        needs: frontend
        timeout-minutes: 60
        permissions:
            contents: read
        env:
            FRONTEND_ARTIFACT_NAME: ${{ needs.frontend.outputs.artifact_name }}
            MESHCHATX_FRONTEND_PREBUILT: "1"
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Smoke-test package bloat checker
              env:
                  TMPDIR: ${{ runner.temp }}
              run: bash scripts/ci/verify-package-contents-smoke.sh

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Fetch frontend artifact
              uses: $/.github/actions/fetch-frontend-artifact
              with:
                  artifact-name: ${{ env.FRONTEND_ARTIFACT_NAME }}

            - name: Compile backend sources
              run: task compile

            - name: Build backend (cx_Freeze)
              run: pnpm run build-backend

            - name: Verify bleak bundled in frozen backend
              run: bash scripts/ci/github-verify-frozen-bleak.sh build/exe

            - name: Verify RNS.vendor.umsgpack bundled in frozen backend
              run: bash scripts/ci/github-verify-frozen-umsgpack.sh build/exe

            - name: Verify FS sandbox modules bundled in frozen backend
              run: bash scripts/ci/github-verify-frozen-sandbox.sh build/exe

            - name: Verify frozen backend import runtime
              run: bash scripts/ci/github-verify-frozen-runtime.sh build/exe

            - name: Verify frozen pycodec2/libcodec2 layout
              run: bash scripts/ci/github-verify-frozen-codec2.sh build/exe

            - name: Verify frozen backend has no package bloat
              run: bash scripts/ci/verify-package-contents.sh frozen build/exe

            - name: Verify workspace clean
              uses: $/.github/actions/verify-workspace-clean

            - name: Upload Linux build-check artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: meshchatx-linux-build-check-${{ github.run_id }}
                  path: |
                      meshchatx/public/
                      build/exe/
                  if-no-files-found: warn

    validate-build-artifact:
        name: Validate Linux build artifact
        runs-on: self-hosted
        timeout-minutes: 15
        needs: build-check
        permissions:
            contents: read
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Download Linux build-check artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: meshchatx-linux-build-check-${{ github.run_id }}
                  path: .artifacts/linux-build-check

            - name: Validate artifact contents
              run: |
                  set -euo pipefail
                  test -d ".artifacts/linux-build-check/meshchatx/public"
                  test -d ".artifacts/linux-build-check/build/exe"
                  test -n "$(ls -A .artifacts/linux-build-check/meshchatx/public)"
                  test -n "$(ls -A .artifacts/linux-build-check/build/exe)"
                  bash scripts/ci/github-verify-frozen-bleak.sh \
                      .artifacts/linux-build-check/build/exe
                  bash scripts/ci/github-verify-frozen-umsgpack.sh \
                      .artifacts/linux-build-check/build/exe
                  bash scripts/ci/github-verify-frozen-sandbox.sh \
                      .artifacts/linux-build-check/build/exe
                  bash scripts/ci/github-verify-frozen-runtime.sh \
                      .artifacts/linux-build-check/build/exe
                  bash scripts/ci/github-verify-frozen-codec2.sh \
                      .artifacts/linux-build-check/build/exe
                  bash scripts/ci/verify-package-contents.sh frozen \
                      .artifacts/linux-build-check/build/exe
                  echo "Linux build artifact download + content validation passed."

    e2e:
        name: E2E smoke
        runs-on: self-hosted
        timeout-minutes: 25
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Provision Chromium runtime libs
              run: bash scripts/ci/ensure-playwright-deps.sh

            - name: Run Playwright smoke E2E
              run: bash scripts/ci/github-e2e.sh tests/e2e/smoke.spec.js tests/e2e/live-mesh.spec.js tests/e2e/nomad-favourites-menu.spec.js

            - name: Upload Playwright junit results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: e2e-junit
                  path: test-results/junit/
                  if-no-files-found: ignore

    ui-lighthouse:
        name: UI Lighthouse (core pages)
        if: github.event_name != 'pull_request'
        needs: frontend
        runs-on: self-hosted
        timeout-minutes: 45
        permissions:
            contents: read
        env:
            FRONTEND_ARTIFACT_NAME: ${{ needs.frontend.outputs.artifact_name }}
            MESHCHATX_FRONTEND_PREBUILT: "1"
            MESHCHAT_LH_SKIP_BUILD: "1"
        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: $/.github/actions/setup-dev-environment
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Fetch frontend artifact
              uses: $/.github/actions/fetch-frontend-artifact
              with:
                  artifact-name: ${{ env.FRONTEND_ARTIFACT_NAME }}

            - name: Provision Chromium runtime libs
              run: bash scripts/ci/ensure-playwright-deps.sh

            - name: Run UI page smoke + Lighthouse CI subset
              run: bash scripts/ci/github-lighthouse.sh

            - name: Upload Lighthouse reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: lighthouse-reports
                  path: |
                      test-results/lighthouse/
                      test-results/perf/
                      test-results/heap/
                      test-results/metrics/
                  if-no-files-found: ignore
                  retention-days: 14

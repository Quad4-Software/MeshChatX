# Build multi-arch image, push to GHCR, and keyless-sign the manifest (Cosign).
# Optionally also push to Docker Hub when credentials are configured (fork-friendly).
# Runs on tags (semver tags + :latest) and workflow_dispatch
# (:latest + :dev + :sha-* on master).
#
# Optional Docker Hub (same tag set as GHCR):
#   Repository secrets (both required to enable Hub push. Omit either to skip):
#     DOCKERHUB_USERNAME  Docker Hub user or org (e.g. quad4io).
#     DOCKERHUB_TOKEN     Docker Hub access token (PAT) with push to the target repo.
#   Optional repository variable:
#     DOCKERHUB_REPOSITORY  Image name under the user (default: meshchatx) -> docker.io/$user/$repo
#
# Pinned third-party actions (bump tag and SHA together when upgrading).
# Automated check: first step resolves each tag via api.github.com and
# compares to the commit below. Manual bump helpers (resolve annotated tags):
#
#   curl -sSf -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
#     "https://api.github.com/repos/OWNER/REPO/git/refs/tags/TAG" | jq .
#   # if object.type is "tag", follow object.url and jq -r .object.sha
#
# Pinned refs:
#   actions/checkout@v6.0.1                 8e8c483db84b4bee98b60c0593521ed34d9990e8
#   docker/setup-qemu-action@v3.7.0         c7c53464625b32c7a7e944ae62b3e17d2b600130
#   docker/setup-buildx-action@v3.11.1      e468171a9de216ec08956ac3ada2f0791b6bd435
#   docker/login-action@v3.5.0              184bdaa0721073962dff0199f1fb9940f07167d1
#   docker/build-push-action@v6.18.0        263435318d21b8e681c14492fe198d362a7d2c83
#   sigstore/cosign-installer@v3.10.1       7e8b541eb2e61bf99390e1afd4be13a184e9ebc5

name: Docker (GHCR + Docker Hub)

on:
    # zizmor: ignore[dangerous-triggers] workflow_run is limited to completed
    # CI runs on master that concluded success; the job re-checks the
    # conclusion and checks out the exact tested SHA.
    workflow_dispatch:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [master]
    push:
        tags:
            - "*"

permissions:
    contents: read

concurrency:
    group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    HARDEN_ENDPOINTS: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        uploads.github.com:443
        release-assets.githubusercontent.com:443
        *.githubusercontent.com:443
        *.actions.githubusercontent.com:443
        *.githubapp.com:443
        *.blob.core.windows.net:443
        ghcr.io:443
        azure.archive.ubuntu.com:80
        archive.ubuntu.com:80
        *.ubuntu.com:443
        packages.microsoft.com:443
        pypi.org:443
        upload.pypi.org:443
        *.pythonhosted.org:443
        registry.npmjs.org:443
        nodejs.org:443
        proxy.golang.org:443
        sum.golang.org:443
        sh.rustup.rs:443
        static.rust-lang.org:443
        static.crates.io:443
        index.crates.io:443
        api.adoptium.net:443
        dl.google.com:443
        maven.google.com:443
        repo.maven.apache.org:443
        services.gradle.org:443
        repo.gradle.org:443
        plugins.gradle.org:443
        chaquo.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        download.docker.com:443
        production.cloudfront.docker.com:443
        mirror.gcr.io:443
        *.sigstore.dev:443
        check.trivy.dev:443
        cgr.dev:443
        *.cgr.dev:443
        dl-cdn.alpinelinux.org:443
        *.alpinelinux.org:443
        *.r2.cloudflarestorage.com:443
        dl.flathub.org:443
        flathub.org:443
        api.securityscorecards.dev:443
        meshchatx.com:443
        cdn.playwright.dev:443
        playwright.download.prss.microsoft.com:443
        *.prss.microsoft.com:443
        firefox.settings.services.mozilla.com:443
        *.mozilla.com:443
        storage.googleapis.com:443
        *.stepsecurity.io:443
        archlinux.org:443
        geo.mirror.pkgbuild.com:443
        ziglang.org:443
    REGISTRY: ghcr.io
    # Official .deb from aquasecurity/trivy releases. Scripts/ci/setup-trivy.sh verifies
    # checksums.txt (sigstore) + .deb SHA256 + .deb (sigstore). Bump with upstream tags.
    TRIVY_VERSION: "0.76.0"

jobs:
    build:
        # workflow_run fires for every CI completion on master; only build
        # images when the run actually passed. Tag pushes and manual
        # dispatches are unaffected.
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
        timeout-minutes: 90
        permissions:
            contents: read
            packages: write
            id-token: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - variant: standard
                      dockerfile: ./docker/Dockerfile
                      tag_suffix: ""
                      build_variant: standard
                      oci_description: "MeshChatX is an all-in-one Reticulum client."
                      oci_licenses: "MIT AND 0BSD"
                    - variant: hardened
                      dockerfile: ./docker/Dockerfile.hardened
                      tag_suffix: "-hardened"
                      build_variant: standard
                      oci_description: "MeshChatX is an all-in-one Reticulum client."
                      oci_licenses: "MIT AND 0BSD"
                    - variant: extra
                      dockerfile: ./docker/Dockerfile
                      tag_suffix: "-extra"
                      build_variant: extra
                      oci_description: "MeshChatX all-in-one Reticulum client with i2pd and yggdrasil."
                      oci_licenses: "MIT AND 0BSD AND BSD-3-Clause AND LGPL-3.0-only"
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Verify action pins (GitHub API)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  api="https://api.github.com/repos"
                  resolve() {
                    # jq is not installed on the self-hosted runner; python3 is.
                    python3 -c 'import json,os,sys,urllib.request as U; R,T,A=sys.argv[1:4]; H={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"meshchatx-pin-check"}; g=lambda x: json.load(U.urlopen(U.Request(x,headers=H))); o=g(A+"/"+R+"/git/refs/tags/"+T)["object"]; print(o["sha"] if o["type"]=="commit" else g(o["url"])["object"]["sha"])' "$1" "$2" "${api}"
                  }
                  check() {
                    local repo="$1" tag="$2" want="$3" got
                    got=$(resolve "$repo" "$tag")
                    if [ "$got" != "$want" ]; then
                      printf 'Pin mismatch %s@%s: expected %s got %s\n' "$repo" "$tag" "$want" "$got" >&2
                      exit 1
                    fi
                    printf 'OK %s@%s -> %s\n' "$repo" "$tag" "$got"
                  }
                  check actions/checkout v6.0.1 8e8c483db84b4bee98b60c0593521ed34d9990e8
                  check docker/setup-qemu-action v3.7.0 c7c53464625b32c7a7e944ae62b3e17d2b600130
                  check docker/setup-buildx-action v3.11.1 e468171a9de216ec08956ac3ada2f0791b6bd435
                  check docker/login-action v3.5.0 184bdaa0721073962dff0199f1fb9940f07167d1
                  check docker/build-push-action v6.18.0 263435318d21b8e681c14492fe198d362a7d2c83
                  check sigstore/cosign-installer v3.10.1 7e8b541eb2e61bf99390e1afd4be13a184e9ebc5

            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false
                  # workflow_run events check out the exact commit CI tested,
                  # which may differ from master HEAD if it moved since.
                  ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

            - name: OCI label timestamps and version
              id: oci
              run: |
                  set -euo pipefail
                  echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
                  if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                    echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
                  fi

            - name: Registry image (GHCR lowercase)
              id: image
              run: |
                  set -euo pipefail
                  lower="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
                  echo "name=${REGISTRY}/${lower}" >> "$GITHUB_OUTPUT"

            # The self-hosted runner's service PATH may not include docker
            # (rootless installs, /usr/local, snap). Locate any container CLI
            # and put its directory on PATH for the docker/* actions.
            - name: Locate container runtime
              run: | # zizmor: ignore[github-env] discovered paths come from the runner host filesystem, never from workflow input
                  set -euo pipefail
                  found=""
                  # type -P only returns real files on disk; command -v can
                  # return shell functions/aliases/hashes that node actions
                  # cannot exec.
                  for cand in docker podman podman-docker \
                    /usr/bin/docker /usr/local/bin/docker /snap/bin/docker \
                    /usr/bin/podman /usr/local/bin/podman /usr/bin/podman-docker \
                    "$HOME/.docker/bin/docker" "$HOME/.local/bin/docker" \
                    "$HOME/bin/docker" "$HOME/.local/bin/podman"; do
                    p="$(type -P "$cand" 2>/dev/null || true)"
                    if [ -n "$p" ] && [ -x "$p" ]; then found="$p"; break; fi
                  done
                  if [ -z "$found" ]; then
                    # Last resort: static docker CLI. A daemon may still be
                    # reachable via /var/run/docker.sock or a rootless sock.
                    cli="${RUNNER_TEMP:-/tmp}/docker-cli"
                    tmp="$(mktemp -d)"
                    if curl -fsSL --retry 3 \
                        "https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz" \
                        | tar -xz -C "$tmp" \
                      && [ -x "$tmp/docker/docker" ]; then
                      mkdir -p "$cli"
                      cp "$tmp/docker/docker" "$cli/docker"
                      chmod +x "$cli/docker"
                      found="$cli/docker"
                      echo "using static docker CLI: $found"
                    else
                      echo "container CLI not found and static download failed" >&2
                      exit 1
                    fi
                  fi
                  echo "container CLI: $found"
                  if [ "$(basename "$found")" = "docker" ]; then
                    dirname "$found" >> "$GITHUB_PATH"
                  else
                    # docker/* actions call `docker` literally; shim the name.
                    shim="${RUNNER_TEMP:-/tmp}/docker-shim"
                    mkdir -p "$shim"
                    ln -sf "$found" "$shim/docker"
                    echo "$shim" >> "$GITHUB_PATH"
                  fi
                  if [ -n "${XDG_RUNTIME_DIR:-}" ]; then
                    for sock in "$XDG_RUNTIME_DIR/docker.sock" "$XDG_RUNTIME_DIR/podman/podman.sock" /run/podman/podman.sock /var/run/docker.sock; do
                      if [ -S "$sock" ]; then
                        echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
                        echo "rootless socket: $sock"
                        break
                      fi
                    done
                  fi

            - name: Set up QEMU
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

            - name: Log in to GHCR
              uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Detect Docker Hub credentials
              id: dockerhub
              env:
                  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
                  DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Log in to Docker Hub
              if: ${{ steps.dockerhub.outputs.configured == 'true' }}
              uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Generate GHCR tags
              id: tags
              env:
                  GITHUB_REF: ${{ github.ref }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  TAG_SUFFIX: ${{ matrix.tag_suffix }}
                  IMAGE_NAME: ${{ steps.image.outputs.name }}
              run: |
                  set -euo pipefail
                  sh scripts/ci/docker-tags.sh "${IMAGE_NAME}" ${RUNNER_TEMP:-/tmp}/docker-tags.txt
                  {
                    echo 'tags<<EOF'
                    sed 's/^-t //' ${RUNNER_TEMP:-/tmp}/docker-tags.txt
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Generate Docker Hub tags
              id: dh_tags
              if: ${{ steps.dockerhub.outputs.configured == 'true' }}
              env:
                  GITHUB_REF: ${{ github.ref }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  TAG_SUFFIX: ${{ matrix.tag_suffix }}
                  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
                  DH_REPO_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}
              run: |
                  set -euo pipefail
                  repo="${DH_REPO_NAME:-meshchatx}"
                  base="docker.io/$(printf '%s' "$DH_USER" | tr '[:upper:]' '[:lower:]')/$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')"
                  sh scripts/ci/docker-tags.sh "${base}" ${RUNNER_TEMP:-/tmp}/docker-hub-tags.txt
                  {
                    echo 'tags<<EOF'
                    sed 's/^-t //' ${RUNNER_TEMP:-/tmp}/docker-hub-tags.txt
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            # GHCR accepts OCI zstd layers. Docker.io regular repos still
            # expect gzip, so the Hub export is a second cache-hit build.
            # build-push-action has no compression inputs. They go through the
            # image exporter options in `outputs`.
            - name: Build and push (GHCR, zstd layers)
              id: build
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64,linux/arm64
                  sbom: true
                  provenance: mode=max
                  outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
                  tags: ${{ steps.tags.outputs.tags }}
                  build-args: |
                      OCI_REVISION=${{ github.event.workflow_run.head_sha || github.sha }}
                      OCI_VERSION=${{ steps.oci.outputs.version }}
                      OCI_CREATED=${{ steps.oci.outputs.created }}
                      VARIANT=${{ matrix.build_variant }}
                      OCI_DESCRIPTION=${{ matrix.oci_description }}
                      OCI_LICENSES=${{ matrix.oci_licenses }}

            - name: Build and push (Docker Hub, gzip layers)
              if: ${{ steps.dockerhub.outputs.configured == 'true' }}
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64,linux/arm64
                  push: true
                  sbom: true
                  provenance: mode=max
                  tags: ${{ steps.dh_tags.outputs.tags }}
                  build-args: |
                      OCI_REVISION=${{ github.event.workflow_run.head_sha || github.sha }}
                      OCI_VERSION=${{ steps.oci.outputs.version }}
                      OCI_CREATED=${{ steps.oci.outputs.created }}
                      VARIANT=${{ matrix.build_variant }}
                      OCI_DESCRIPTION=${{ matrix.oci_description }}
                      OCI_LICENSES=${{ matrix.oci_licenses }}

            - name: Verify image has no package bloat
              env:
                  IMAGE_NAME: ${{ steps.image.outputs.name }}
                  IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  img="${IMAGE_NAME}@${IMAGE_DIGEST}"
                  docker pull --platform linux/amd64 "$img"
                  bash scripts/ci/verify-package-contents.sh docker "$img"

            - name: Apt update (for Trivy .deb)
              run: command -v apt-get >/dev/null 2>&1 && sh scripts/ci/exec-priv.sh apt-get update -qq || true

            - name: Setup Trivy
              run: sh scripts/ci/setup-trivy.sh

            - name: Trivy image scan (amd64)
              env:
                  IMAGE_NAME: ${{ steps.image.outputs.name }}
                  IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  # amd64 layer already pulled above. --ignore-unfixed keeps the gate
                  # actionable (fails only when a fix exists upstream). openvex.json
                  # statements suppress not_affected/fixed findings.
                  trivy image --exit-code 1 --severity HIGH,CRITICAL \
                    --ignore-unfixed --vex openvex.json \
                    "${IMAGE_NAME}@${IMAGE_DIGEST}"

            - name: Install Cosign
              uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

            - name: Cosign sign (keyless, GHCR only)
              env:
                  COSIGN_YES: "true"
                  IMAGE_NAME: ${{ steps.image.outputs.name }}
                  IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  test -n "${IMAGE_DIGEST}"
                  cosign sign "${IMAGE_NAME}@${IMAGE_DIGEST}"

# Install Node, install pnpm globally via npm, then restore setup-node's
# pnpm cache. pnpm is installed directly rather than through corepack:
# corepack leaves yarn/pnpm shims in the shared toolcache, and setup-node's
# environment probe can hang executing them on self-hosted runners.
name: Setup Node.js and pnpm
description: Node.js, npm-installed pnpm, and pnpm store cache

inputs:
    node-version:
        description: Node.js version
        required: true
    pnpm-version:
        description: pnpm version installed globally via npm
        required: false
        default: "12.15.0"
    cache-dependency-path:
        description: Lockfile path used for the pnpm cache key
        required: false
        default: pnpm-lock.yaml

runs:
    using: composite
    steps:
        - name: Provide a runtime dir for pnpm store locks
          shell: bash
          run: |
              set -euo pipefail
              # pnpm 12 places store operation locks under XDG_RUNTIME_DIR,
              # falling back to /tmp. Self-hosted runners may not have /tmp,
              # so give pnpm a per-job runtime dir that passes its
              # ownership and permission checks.
              xdg_runtime="${RUNNER_TEMP:-${TMPDIR:-${HOME}/.cache}}/xdg-runtime"
              mkdir -p "${xdg_runtime}"
              chmod 700 "${xdg_runtime}"
              echo "XDG_RUNTIME_DIR=${xdg_runtime}" >> "${GITHUB_ENV}"

        - name: Remove stale corepack shims
          shell: bash
          run: |
              set -euo pipefail
              # Older runs left corepack shims (yarn, pnpm, ...) inside the
              # shared toolcache. setup-node's environment probe executes
              # yarn --version, and a cold corepack cache can hang trying to
              # reach yarnpkg endpoints that egress policies may block.
              for d in "${RUNNER_TOOL_CACHE:-}/node"/*/*/bin; do
                  [ -d "$d" ] || continue
                  rm -f "$d/yarn" "$d/yarnpkg" "$d/pnpm" "$d/pnpx" "$d/pn" "$d/px"
              done

        - name: Set up Node.js
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
          with:
              node-version: ${{ inputs.node-version }}

        - name: Install pnpm
          shell: bash
          env:
              PNPM_VERSION: ${{ inputs.pnpm-version }}
          run: |
              set -euo pipefail
              for attempt in 1 2 3; do
                  if npm install -g "pnpm@${PNPM_VERSION}"; then
                      exit 0
                  fi
                  echo "npm install -g pnpm failed (attempt $attempt of 3); retrying"
                  sleep $((attempt * 5))
              done
              exit 1

        - name: Verify Node.js version
          shell: bash
          run: |
              set -euo pipefail
              node -v
              pnpm -v
              node -e "const major=Number(process.versions.node.split('.')[0]); if(major<24) process.exit(1)"

        - name: Cache pnpm dependencies
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
          with:
              node-version: ${{ inputs.node-version }}
              cache: pnpm
              cache-dependency-path: ${{ inputs.cache-dependency-path }}

# Install Node, activate pnpm via corepack, then restore setup-node's pnpm cache.
# setup-node with cache: pnpm requires pnpm on PATH during that step (see setup-node docs).
name: Setup Node.js and pnpm
description: Node.js, corepack-managed pnpm, and pnpm store cache

inputs:
    node-version:
        description: Node.js version
        required: true
    pnpm-version:
        description: pnpm version activated through corepack
        required: false
        default: "11.1.2"
    cache-dependency-path:
        description: Lockfile path used for the pnpm cache key
        required: false
        default: pnpm-lock.yaml

runs:
    using: composite
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
          with:
              node-version: ${{ inputs.node-version }}

        - name: Cache corepack downloads
          uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
          with:
              path: |
                  ~/.cache/node/corepack
                  ~/Library/Caches/node/corepack
                  ~/AppData/Local/node/corepack
              key: corepack-${{ runner.os }}-${{ inputs.node-version }}-pnpm-${{ inputs.pnpm-version }}

        - name: Enable pnpm (corepack)
          shell: bash
          env:
              PNPM_VERSION: ${{ inputs.pnpm-version }}
          run: |
              set -euo pipefail
              corepack enable
              for attempt in 1 2 3; do
                  if corepack prepare "pnpm@${PNPM_VERSION}" --activate; then
                      exit 0
                  fi
                  echo "corepack prepare failed (attempt $attempt of 3); retrying"
                  sleep $((attempt * 5))
              done
              exit 1

        - name: Verify Node.js version
          shell: bash
          run: |
              set -euo pipefail
              node -v
              pnpm -v
              node -e "const major=Number(process.versions.node.split('.')[0]); if(major<24) process.exit(1)"

        - name: Cache pnpm dependencies
          uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
          with:
              node-version: ${{ inputs.node-version }}
              cache: pnpm
              cache-dependency-path: ${{ inputs.cache-dependency-path }}

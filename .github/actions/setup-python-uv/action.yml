# Pinned actions (bump tag and SHA together when upgrading):
#   actions/setup-python@v6.2.0  5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0         55cc8345863c7cc4c66a329aec7e433d2d1c52a9
name: Set up Python and UV
description: Python runtime, checksum-verified UV binary, and UV download cache

inputs:
    python-version:
        description: Python version
        required: true
    python-allow-prereleases:
        description: Allow pre-release Python versions via setup-python
        required: false
        default: "false"
    uv-version:
        description: UV version installed from GitHub releases
        required: false
        default: "0.13.5"

runs:
    using: composite
    steps:
        # setup-python filters manifest files by platform_version, which only
        # exists on Ubuntu/Debian releases - on other distros (e.g. the Arch
        # self-hosted runner) the version lookup always fails. continue-on-error
        # lets the uv-managed fallback below take over on those hosts.
        - name: Set up Python
          id: setup-python
          continue-on-error: true
          uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
          with:
              python-version: ${{ inputs.python-version }}
              allow-prereleases: ${{ inputs.python-allow-prereleases }}

        - name: Install UV (release binary + SHA256)
          shell: bash
          env:
              UV_VERSION: ${{ inputs.uv-version }}
              # /usr/local/bin is not writable on all self-hosted runners;
              # RUNNER_TEMP always is. Exported to PATH for later steps.
              UV_INSTALL_DIR: ${{ runner.temp }}/bin
          run: |
              bash scripts/ci/github-install-uv.sh
              echo "${UV_INSTALL_DIR}" >> "${GITHUB_PATH}"

        - name: Fallback to uv-managed Python
          if: steps.setup-python.outcome == 'failure'
          shell: bash
          env:
              UV_PYTHON_VERSION: ${{ inputs.python-version }}
          run: |
              set -euo pipefail
              uv python install "${UV_PYTHON_VERSION}"
              PYBIN="$(uv python find "${UV_PYTHON_VERSION}")"
              echo "$(dirname "${PYBIN}")" >> "${GITHUB_PATH}"
              "${PYBIN}" --version

        - name: Cache UV downloads
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
          with:
              path: ~/.cache/uv
              key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
              restore-keys: |
                  uv-${{ runner.os }}-${{ runner.arch }}-

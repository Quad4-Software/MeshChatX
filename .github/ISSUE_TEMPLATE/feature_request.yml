name: Feature Request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Describe what you want and why it helps. Include the version and platform when the request is platform-specific.

    - type: input
      id: version
      attributes:
          label: MeshChatX version
          description: The version you are using, if relevant.
          placeholder: "4.9.0"

    - type: dropdown
      id: platform
      attributes:
          label: Platform
          description: Which platform does this affect?
          options:
              - Desktop (Electron)
              - Android
              - Web UI
              - Headless server
              - All platforms
              - Other
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: Area
          description: Which part of MeshChatX does this touch?
          options:
              - Messaging / LXMF
              - LXST calls / audio
              - RRC relay chat
              - NomadNet / pages
              - Maps / overlays
              - Plugins
              - UI / accessibility
              - Packaging / install
              - Reticulum interfaces
              - Other
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: Problem or use case
          description: What are you trying to do, and what is missing today?
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: How would you like this to work?
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Any workarounds you tried.

    - type: checkboxes
      id: terms
      attributes:
          label: Checklist
          options:
              - label: I searched existing issues and discussions for similar requests
                required: true
              - label: I am willing to test the feature on my platform
                required: false

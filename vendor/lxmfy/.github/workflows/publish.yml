# Publish to PyPI via OIDC trusted publishing and create the GitHub release.
# Secure-use: environment protection, minimal permissions, SHA-pinned actions,
# secrets via env vars (never interpolated into run scripts), no pull_request_target.
# Releases on this repo are immutable: the workflow creates the release as a
# draft, attaches assets, then publishes. Do not create releases by hand.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to confirm a manual publish from this ref
        required: true
        type: string
      tag:
        description: Existing tag to create the GitHub release for
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Validate trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          REF: ${{ github.ref }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            echo "Tag push publish allowed"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM" = "publish" ] && [ -n "$TAG_INPUT" ]; then
            echo "Manual publish confirmed for tag=$TAG_INPUT"
            exit 0
          fi
          echo "Refusing publish for event=$EVENT_NAME ref=$REF confirm=$CONFIRM tag=$TAG_INPUT"
          exit 1

  build:
    name: Build distributions
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Sigstore OIDC token for SLSA provenance
      attestations: write  # publish provenance to the repo attestation store
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Build
        run: poetry build

      - name: Attest wheel and sdist
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  zipapp:
    name: Build zipapp (pyz)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload attaches the pyz to the release
      id-token: write  # Sigstore OIDC token for SLSA provenance
      attestations: write  # publish provenance to the repo attestation store
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build zipapp
        run: |
          pipx install shiv==1.0.8
          whl=$(ls dist/lxmfy-*-py3-none-any.whl)
          ver=$(basename "$whl" | cut -d- -f2)
          shiv --compressed \
            -c lxmfy \
            -p "/usr/bin/env python3" \
            -o "dist/lxmfy-${ver}.pyz" \
            "$whl"
          ls -lh dist/

      - name: Smoke test zipapp
        run: |
          pyz=$(ls dist/lxmfy-*.pyz)
          python3 "$pyz" --help | head -5

      - name: Attest zipapp
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.pyz

      - name: Upload pyz artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lxmfy-zipapp
          path: dist/*.pyz
          if-no-files-found: error
          retention-days: 30

  docs-artifacts:
    name: Build docs artifacts
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release upload attaches docs bundles to the release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install docs tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint
          pip install --require-hashes -r docs/requirements-docs.txt
          pip install --no-deps -e .

      - name: Build PDF, EPUB, and text bundles
        run: bash docs/build-release-docs.sh docs-dist

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-bundles
          path: docs-dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: [build, zipapp, docs-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach assets
      actions: write  # dispatch the docs version deploy
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Download pyz artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lxmfy-zipapp
          path: dist/
      - name: Download docs bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-bundles
          path: docs-dist/
      - name: Resolve release tag
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${TAG_INPUT:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to release tag=$tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ver="${RELEASE_TAG#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found = 1; next }
            found
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file release-notes.md
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* docs-dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Trigger docs version deploy
        # Releases published by GITHUB_TOKEN do not emit release events, so
        # the docs deploy is dispatched directly instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run docs.yml --ref master -f "version=${RELEASE_TAG#v}" -f set_latest=true

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read  # download the built distributions
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

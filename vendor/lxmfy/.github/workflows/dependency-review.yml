# Dependency review on pull requests (GitHub secure-use / supply chain).
# Requires Dependency graph enabled (on by default for public repos).

name: Dependency Review

on:
  pull_request:
    branches: [master]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read  # read the diff's dependency manifests
      pull-requests: write  # comment-summary-in-pr posts a failure comment on the PR
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

# Monthly dependency freshness check. Runs poetry show -o and opens or
# updates a tracking issue when dependencies fall behind. Read-only on
# the repo; only writes to issues.

name: Dependency freshness

on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

concurrency:
  group: deps-freshness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Report outdated dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # open or update the outdated-deps tracking issue
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install poetry
        run: pipx install poetry==2.4.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install project dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Collect outdated dependencies
        run: poetry show --outdated --format json > outdated.json

      - name: Build report
        id: report
        run: |
          python - <<'EOF'
          import json

          with open("outdated.json") as f:
              data = json.load(f)

          if not isinstance(data, list):
              data = []

          lines = [
              "<!-- deps-freshness -->",
              "Outdated dependencies from `poetry show --outdated`:",
              "",
              "| Package | Current | Latest |",
              "| --- | --- | --- |",
          ]
          for item in data:
              name = item.get("name", "?")
              current = item.get("version", "?")
              latest = item.get("latest", "?")
              lines.append(f"| {name} | {current} | {latest} |")

          with open("report.md", "w") as f:
              f.write("\n".join(lines) + "\n")

          with open("outdated_count", "w") as f:
              f.write(str(len(data)))
          EOF
          echo "count=$(cat outdated_count)" >> "$GITHUB_OUTPUT"

      - name: Close report when up to date
        if: steps.report.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue=$(gh issue list --repo "$GH_REPO" --state open \
            --search 'deps-freshness in:body' --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GH_REPO" \
              --comment "Dependencies are up to date as of the latest check."
          fi

      - name: Create or update tracking issue
        if: steps.report.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue=$(gh issue list --repo "$GH_REPO" --state open \
            --search 'deps-freshness in:body' --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GH_REPO" --body-file report.md
          else
            gh issue create --repo "$GH_REPO" \
              --title "Outdated dependencies" \
              --body-file report.md
          fi
